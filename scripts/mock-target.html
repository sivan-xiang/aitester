<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mock OSS（仿 freighthouse）</title>
<style>
  body{font-family:'PingFang SC','Microsoft YaHei',sans-serif;margin:0;background:#f0f2f5}
  .login-box{max-width:360px;margin:120px auto;background:#fff;padding:32px;border-radius:8px;box-shadow:0 2px 12px rgba(0,0,0,.1)}
  .login-box h2{text-align:center;margin:0 0 24px}
  input{width:100%;padding:10px;margin-bottom:14px;border:1px solid #dcdfe6;border-radius:4px;box-sizing:border-box}
  button{padding:10px 20px;border:none;border-radius:4px;cursor:pointer}
  .el-button--primary{background:#409eff;color:#fff;width:100%}
  .layout{display:flex;min-height:100vh}
  .menu{width:220px;background:#1f2d3d;color:#fff;padding-top:10px}
  .el-menu-item{padding:14px 20px;cursor:pointer}
  .el-menu-item:hover{background:#263445}
  .main{flex:1;padding:20px}
  .card{background:#fff;border-radius:8px;padding:20px;margin-top:16px}
  .field{margin-bottom:16px}
  .field label{display:block;margin-bottom:6px;color:#606266}
  .el-message{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#f0f9eb;color:#67c23a;border:1px solid #e1f3d8;padding:10px 20px;border-radius:4px;display:none;z-index:99}
  .topbar{padding:12px 20px;background:#fff;font-weight:600}
</style>
</head>
<body>
<div id="app"></div>
<script>
function token(){ return localStorage.getItem('X-TOKEN'); }
function render(){
  const hash = location.hash || '#/';
  const root = document.getElementById('app');
  const isDash = hash.indexOf('#/dashboard') === 0 && token();
  if(!isDash){
    root.innerHTML = '<div class="login-box"><h2>系统登录</h2>' +
      '<input type="text" placeholder="用户名" id="u">' +
      '<input type="password" placeholder="密码" id="p">' +
      '<button class="el-button el-button--primary" id="loginBtn">登录</button></div>';
    document.getElementById('loginBtn').onclick = function(){
      var u = document.getElementById('u').value, p = document.getElementById('p').value;
      if(u === 'admin' && p === '123456'){ localStorage.setItem('X-TOKEN','mock-token'); location.hash = '#/dashboard'; }
      else { alert('账号或密码错误'); }
    };
    return;
  }
  // dashboard
  root.innerHTML = '<div class="layout"><div class="menu">' +
    '<div class="el-menu-item" id="m-perf">薪酬绩效</div>' +
    '<div class="el-menu-item" id="m-other">其他模块</div></div>' +
    '<div class="main"><div class="topbar">货代 OSS 后台</div><div id="content"></div></div></div>';
  document.getElementById('m-perf').onclick = function(){ showPanel(); };
  document.getElementById('m-other').onclick = function(){ document.getElementById('content').innerHTML = '<div class="card">其他模块内容</div>'; };
  if(hash.indexOf('perf') >= 0) showPanel();
}
function showPanel(){
  document.getElementById('content').innerHTML = '<div class="card"><h3>薪酬绩效 · 指标完成率</h3>' +
    '<div class="field"><label for="rate">直客客户T量完成率</label><input id="rate" placeholder="请输入完成率"></div>' +
    '<div class="field"><label for="rate2">重点船东T量完成率</label><input id="rate2" placeholder="请输入完成率"></div>' +
    '<button class="el-button el-button--primary" id="saveBtn" style="width:auto">保存</button></div>';
  document.getElementById('saveBtn').onclick = function(){
    var m = document.createElement('div'); m.className = 'el-message'; m.id = 'saveMsg'; m.textContent = '保存成功';
    document.body.appendChild(m); m.style.display = 'block';
    setTimeout(function(){ m.style.display = 'none'; }, 1500);
  };
}
window.addEventListener('hashchange', render);
render();
</script>
</body>
</html>
